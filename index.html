<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Christmas Story</title>
<meta name="theme-color" content="#120a07">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap">
<style>
/* One look, on purpose: a warm Christmas night. Layout: the film fills the screen —
   the vertical cut on an upright phone, the landscape cut everywhere else. */
:root {
  --night: #120a07; --gold: #f6d57a; --gold-deep: #c9a24a; --paper: #fdf6ea; --ink: #3a2a20;
  --display: 'Great Vibes', 'Pinyon Script', cursive; --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Lato', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--paper); font-family: var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

.backdrop { position: fixed; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); filter: blur(28px) brightness(.55) saturate(1.2); }
.frame { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100vw, calc(100vh * 9 / 16)); overflow: hidden; background: #000; }
.frame.wide { left: 0; right: 0; width: 100%; transform: none; }
.cam { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.cam video, .cam .still, .cam canvas.rbg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
#loopv { opacity: 0; }
.cam video.react { opacity: 0; transition: opacity .35s ease; }
.cam video.react.on { opacity: 1; }
.wide .cam video.react { object-fit: contain; }
.cam canvas.rbg { filter: blur(26px) brightness(.6) saturate(1.2); transform: scale(1.15); opacity: 0; transition: opacity .35s ease; }
.cam canvas.rbg.on { opacity: 1; }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.taps { position: absolute; inset: 0; cursor: pointer; touch-action: manipulation; }
.flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--fxp, 50% 50%), rgba(255,247,220,.95), rgba(255,214,120,.55) 35%, rgba(255,200,100,0) 75%); }
.flash.go { animation: flash .6s ease-out; }
@keyframes flash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }

.scrim-b { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(to top, rgba(10,5,3,.78), transparent); pointer-events: none; transition: opacity .8s; }
.scrim-t { position: absolute; left: 0; right: 0; top: 0; height: 26%; background: linear-gradient(to bottom, rgba(10,5,3,.72), transparent); pointer-events: none; opacity: 0; transition: opacity 1s; }
.wide .scrim-t { right: auto; width: 55%; height: 100%; background: linear-gradient(to right, rgba(10,5,3,.62), rgba(10,5,3,.25) 55%, transparent); }
.cap {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 7%); transform: translateX(-50%);
  width: calc(100% - 36px); max-width: 640px; margin: 0; text-align: center; text-wrap: balance;
  font: italic 500 clamp(19px, 2.4vw + 9px, 30px)/1.35 var(--serif); color: #fff3d8; text-shadow: 0 2px 14px rgba(0,0,0,.7);
  opacity: 0; transition: opacity .7s ease; pointer-events: none;
}
.cap.on { opacity: 1; }
.title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 3.5%); text-align: center; pointer-events: none; opacity: 0; transform: translateY(-10px); transition: opacity .5s, transform 1s; padding: 0 16px; }
.wide .title { left: 4%; right: auto; top: 9%; text-align: left; padding: 0; }
.title.on { opacity: 1; transform: none; }
.title b { display: block; font: 400 12px/1 var(--sans); letter-spacing: .5em; text-transform: uppercase; color: var(--gold); padding-left: .5em; }
.wide .title b { padding-left: 0; }
.title h1 {
  margin: 6px 0 2px; font: 400 clamp(46px, 5vw + 26px, 96px)/1 var(--display);
  background: linear-gradient(180deg, #fffbe6 8%, #f6d57a 55%, #d89f35 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 12px rgba(0,0,0,.6));
}
.title p { margin: 0; font: italic 400 clamp(17px, 1vw + 12px, 24px)/1.3 var(--serif); color: #fdf1d4; text-shadow: 0 2px 10px rgba(0,0,0,.7); }

.ring { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 2px solid rgba(255, 222, 140, .85); box-shadow: 0 0 22px rgba(255, 200, 100, .6); animation: ring 1.8s ease-out infinite; pointer-events: none; }
@keyframes ring { from { transform: scale(.55); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
.hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2%); transform: translateX(-50%); margin: 0; white-space: nowrap; font: 700 11px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: #f6dc97; text-shadow: 0 1px 8px #000; animation: blinkh 2.2s ease-in-out infinite; pointer-events: none; }
@keyframes blinkh { 50% { opacity: .45; } }
.tip {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 22%); transform: translateX(-50%);
  width: max-content; max-width: min(520px, calc(100% - 28px)); text-align: center; text-wrap: balance;
  padding: 10px 14px; border-radius: 14px; background: rgba(20, 10, 6, .66); border: 1px solid rgba(246, 213, 122, .3);
  font: 400 13px/1.45 var(--sans); color: var(--paper); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  pointer-events: none; animation: tipin .6s ease both;
}
.wide .tip { top: auto; bottom: 14%; }
.tip b { color: var(--gold); }
@keyframes tipin { from { opacity: 0; } }
.vnote { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 48px); max-width: 360px; margin: 0; padding: 14px 16px; border-radius: 14px; text-align: center; background: rgba(20,10,6,.8); border: 1px solid rgba(246,213,122,.35); font: 400 14px/1.5 var(--sans); color: var(--paper); z-index: 26; }
.bubble {
  position: absolute; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; pointer-events: none;
  background: #fffdf6; color: var(--ink); font: 700 14px/1.2 var(--sans); padding: 9px 14px; border-radius: 16px;
  box-shadow: 0 10px 26px -8px rgba(0,0,0,.6); animation: bub .35s cubic-bezier(.3, 1.6, .5, 1) both;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fffdf6; }
.bubble.out { animation: bubout .3s ease forwards; }
@keyframes bub { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)) scale(.6); } }
@keyframes bubout { to { opacity: 0; transform: translate(-50%, calc(-100% - 18px)); } }

.intro { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 45%, rgba(10,6,4,.25), rgba(6,3,2,.86) 78%); transition: opacity 1s ease; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro .k { display: block; font: 400 12px/1 var(--sans); letter-spacing: .5em; text-transform: uppercase; color: var(--gold); padding-left: .5em; }
.intro h2 { margin: 12px 0 6px; font: 400 clamp(56px, 6vw + 34px, 110px)/1 var(--display); background: linear-gradient(180deg, #fffbe6 8%, #f6d57a 55%, #d89f35 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 22px rgba(255,205,110,.35)); }
.intro p { margin: 0; font: italic 400 clamp(18px, 1vw + 13px, 24px)/1.4 var(--serif); }
.intro small { display: block; margin-top: 14px; font: 300 12px/1.4 var(--sans); letter-spacing: .1em; color: rgba(253,246,234,.6); }
.btn { font: 700 12px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; border-radius: 999px; padding: 14px 24px; cursor: pointer; color: var(--gold); background: rgba(20,10,6,.55); border: 1px solid rgba(246,213,122,.5); }
.btn-main { color: #3a1a0c; background: linear-gradient(180deg, #ffe7a2, #e9b54a); border-color: transparent; box-shadow: 0 8px 22px -8px rgba(233,181,74,.8); }
.btn:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.begin { margin-top: 26px; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; padding: 16px 28px; }
.begin svg { width: 14px; height: 14px; }
.chip { position: absolute; z-index: 25; display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px 9px 11px; border-radius: 999px; background: rgba(20,10,6,.55); color: var(--gold); border: 1px solid rgba(246,213,122,.35); font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip svg { width: 16px; height: 16px; }
.snd { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); }
.skip { left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); }
.reopen { left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
.snd .off { display: none; }
.snd[aria-pressed="false"] .on { display: none; }
.snd[aria-pressed="false"] .off { display: inline; }
.cardwrap { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 16px; background: rgba(6,3,2,.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .4s ease both; }
@keyframes fadein { from { opacity: 0; } }
.card-pop { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; animation: cardin 1s cubic-bezier(.2,.9,.25,1.06) both; }
@keyframes cardin { from { opacity: 0; transform: translate(var(--fx,0), var(--fy,0)) scale(.06) rotate(-12deg); } 35% { opacity: 1; } }
.card { width: min(330px, 86%, 52vh); aspect-ratio: 3 / 4.2; padding: 26px 22px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 12px; border-radius: 12px;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,220,150,.2), transparent 60%), linear-gradient(160deg, #8c2434, #5a1520); border: 1px solid var(--gold-deep);
  box-shadow: 0 0 0 6px rgba(201,162,74,.18), 0 30px 70px -18px rgba(0,0,0,.8), inset 0 0 0 8px rgba(201,162,74,.25), 0 0 60px rgba(255,200,110,.25); }
.card h3 { margin: 0; font: 400 clamp(40px, 9vw, 56px)/1 var(--display); color: var(--gold); }
.card .dear { margin: 6px 0 0; font: italic 500 21px/1.3 var(--serif); }
.card .msg { margin: 0; font: italic 400 18px/1.5 var(--serif); color: rgba(253,246,234,.92); text-wrap: balance; }
.card .from { margin: 8px 0 0; font: 700 11px/1.4 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@media (prefers-reduced-motion: reduce) { .ring, .hint, .card-pop, .cardwrap, .bubble { animation: none; } .cam { transition: none; } }
</style>
</head>
<body>


<canvas class="backdrop" id="backdrop" width="36" height="64" aria-hidden="true"></canvas>
<main class="frame" id="frame">
  <div class="cam" id="cam">
    <img class="still" id="stillStart" alt="">
    <img class="still" id="stillEnd" alt="" hidden>
    <video id="mainv" playsinline webkit-playsinline preload="auto"></video>
    <video id="loopv" playsinline webkit-playsinline muted loop preload="auto"></video>
    <canvas class="rbg" id="rbg" width="36" height="64" aria-hidden="true"></canvas>
    <video class="react" id="r1v" playsinline webkit-playsinline preload="metadata" src="media/react_santa.mp4"></video>
    <video class="react" id="r2v" playsinline webkit-playsinline preload="metadata" src="media/react_elves.mp4"></video>
  </div>
  <div class="scrim-t" id="scrimT"></div>
  <div class="scrim-b" id="scrimB"></div>
  <div class="flash" id="flash"></div>
  <canvas class="fx" id="fx"></canvas>
  <div class="taps" id="taps" hidden></div>
  <div class="fx" id="bubbles"></div>
  <p class="cap" id="cap" aria-live="polite"></p>
  <div class="title" id="title"><b>Merry</b><h1>Christmas</h1><p id="titleFor"></p></div>
  <div class="ring" id="ring" hidden></div>
  <p class="hint" id="hint" hidden>Tap the gift to open it</p>
  <p class="tip" id="tip" hidden></p>
  <p class="vnote" id="vnote" hidden>This viewer can't play the film. Open this card in Chrome or Safari to watch it. You can still open your gift.</p>

  <button class="chip skip" id="skip" type="button" hidden>Skip</button>
  <button class="chip snd" id="snd" type="button" aria-pressed="true" aria-label="Sound" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="off" d="m22 9-6 6M16 9l6 6"/></svg>
    <span class="on">Sound on</span><span class="off">Sound off</span>
  </button>
  <button class="chip reopen" id="reopen" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    Your card
  </button>

  <div class="intro" id="intro">
    <div>
      <span class="k">A Christmas story</span>
      <h2 id="introFor"></h2>
      <p id="introFrom"></p>
      <button class="btn btn-main begin" id="begin" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Begin the story</button>
      <small>Turn your sound on</small>
    </div>
  </div>

  <div class="cardwrap" id="cardwrap" role="dialog" aria-modal="true" aria-label="Your Christmas card" hidden>
    <div class="card-pop" id="cardpop">
      <div class="card">
        <h3>Merry Christmas</h3>
        <p class="dear" id="cDear"></p>
        <p class="msg" id="cMsg"></p>
        <p class="from" id="cFrom"></p>
      </div>
      <div class="card-actions">
        <button class="btn btn-main" id="explore" type="button">Keep exploring</button>
        <button class="btn" id="again" type="button">Watch again</button>
      </div>
    </div>
  </div>
</main>

<script>
/* ── sound: a music-box "Jingle Bells" (public domain, 1857), sleigh bells and wind, all synthesised ── */
function createSound() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  var ctx = null, master, verb, dry, timer = 0, next = 0, step = 0, on = false, wind = null;
  var F = { C3: 130.81, D3: 146.83, G2: 98.0, F2: 87.31, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, C6: 1046.5, E6: 1318.5, G6: 1568 };
  var BEAT = 0.32;
  var A = [["E5",1],["E5",1],["E5",2],["E5",1],["E5",1],["E5",2],["E5",1],["G5",1],["C5",1.5],["D5",0.5],["E5",4],
           ["F5",1],["F5",1],["F5",1.5],["F5",0.5],["F5",1],["E5",1],["E5",1],["E5",0.5],["E5",0.5],["E5",1],["D5",1],["D5",1],["E5",1],["D5",2],["G5",2]];
  var B = [["E5",1],["E5",1],["E5",2],["E5",1],["E5",1],["E5",2],["E5",1],["G5",1],["C5",1.5],["D5",0.5],["E5",4],
           ["F5",1],["F5",1],["F5",1.5],["F5",0.5],["F5",1],["E5",1],["E5",1],["E5",0.5],["E5",0.5],["G5",1],["G5",1],["F5",1],["D5",1],["C5",4]];
  var MEL = A.concat(B), BARS = ["C3","C3","C3","C3","F2","C3","D3","G2","C3","C3","C3","C3","F2","C3","G2","C3"];
  var events = [];
  (function () {
    var beat = 0;
    MEL.forEach(function (n) { events.push({ b: beat, f: F[n[0]], kind: "m" }); beat += n[1]; });
    for (var i = 0; i < 16; i++) {
      events.push({ b: i * 4, f: F[BARS[i]], kind: "b" });
      events.push({ b: i * 4 + 2, f: F[BARS[i]] * 1.5, kind: "b" });
      for (var k = 0; k < 4; k++) events.push({ b: i * 4 + k + 0.5, kind: "j", v: k % 2 ? 0.8 : 0.5 });
    }
    events.sort(function (a, b) { return a.b - b.b; });
  })();
  var LOOP = 64;

  function noiseBuf(sec) {
    var b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * sec), ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function init() {
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    dry = ctx.createGain(); dry.gain.value = 0.8; dry.connect(master);
    verb = ctx.createConvolver();
    var len = ctx.sampleRate * 2.6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) { var d = ir.getChannelData(c); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir;
    var wet = ctx.createGain(); wet.gain.value = 0.35; verb.connect(wet); wet.connect(master);
    /* wind */
    var src = ctx.createBufferSource(); src.buffer = noiseBuf(4); src.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 170; lp.Q.value = 0.7;
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.31; var lfoG = ctx.createGain(); lfoG.gain.value = 60;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    var wg = ctx.createGain(); wg.gain.value = 0.09;
    src.connect(lp); lp.connect(wg); wg.connect(master); src.start(); lfo.start();
    wind = wg;
  }
  function bell(f, t, v, len) {
    [[1, 1], [2, 0.22], [4.07, 0.05]].forEach(function (p) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = f * p[0];
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v * p[1], t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0005, t + (len || 1.4) / p[0] * 1.2);
      o.connect(g); g.connect(dry); g.connect(verb);
      o.start(t); o.stop(t + (len || 1.4) * 1.3);
    });
  }
  function bass(f, t) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.11, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.9);
    o.connect(g); g.connect(dry); o.start(t); o.stop(t + 1);
  }
  var jb = null;
  function jingle(t, v) {
    if (!jb) jb = noiseBuf(0.2);
    for (var k = 0; k < 3; k++) {
      var s = ctx.createBufferSource(); s.buffer = jb;
      var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 6500 + Math.random() * 3000; bp.Q.value = 6;
      var g = ctx.createGain(), tt = t + k * 0.018 + Math.random() * 0.01;
      g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(0.09 * v, tt + 0.003); g.gain.exponentialRampToValueAtTime(0.0005, tt + 0.13);
      s.connect(bp); bp.connect(g); g.connect(dry); g.connect(verb); s.start(tt, Math.random() * 0.05); s.stop(tt + 0.15);
    }
  }
  function crackle(t, v) {
    if (!jb) jb = noiseBuf(0.2);
    var s = ctx.createBufferSource(); s.buffer = jb;
    var hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1200 + Math.random() * 3500;
    var g = ctx.createGain(), d = 0.008 + Math.random() * 0.04;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime((v || 1) * (0.04 + Math.random() * 0.13), t + 0.002); g.gain.exponentialRampToValueAtTime(0.0005, t + d);
    s.connect(hp); hp.connect(g); g.connect(dry); s.start(t, Math.random() * 0.1); s.stop(t + d + 0.02);
  }
  function tick() {
    if (Math.random() < 0.32) crackle(ctx.currentTime + Math.random() * 0.08, 0.8);
    while (next < ctx.currentTime + 0.35) {
      var e = events[step % events.length];
      var loop = Math.floor(step / events.length);
      var t = Math.max(next, ctx.currentTime);
      if (e.kind === "m") bell(e.f, t, 0.16, 1.6);
      else if (e.kind === "b") bass(e.f, t);
      else jingle(t, e.v);
      step++;
      var n = events[step % events.length];
      var nb = n.b + Math.floor(step / events.length) * LOOP;
      next = start + nb * BEAT;
    }
  }
  var start = 0;
  return {
    get on() { return on; },
    play: function () {
      if (!ctx) init();
      if (ctx.state === "suspended") ctx.resume();
      if (on) return;
      on = true;
      master.gain.cancelScheduledValues(ctx.currentTime);

    for (var j = shooting.length - 1; j >= 0; j--) {
      var m = shooting[j]; m.life += dt;
      if (m.life > m.max) { shooting.splice(j, 1); continue; }
      m.x += m.vx * dt; m.y += m.vy * dt;
      var L = m.len || 120, g = ctx.createLinearGradient(m.x, m.y, m.x + L, m.y - L * 0.12);
      g.addColorStop(0, "rgba(255,250,230,.95)"); g.addColorStop(1, "rgba(255,230,160,0)");
      ctx.globalAlpha = 1 - m.life / m.max; ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + L, m.y - L * 0.12); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (phase === "story") {
      var t = mainv.currentTime;
      var c = CAPTIONS.find(function (k) { return t >= k[0] && t < k[1]; });
      var text = c ? c[2] : null;
      if (text !== shownCap) setCaption(text);
      if (mainv.duration && t >= mainv.duration - 0.06) toLoop();

    drawBackdrops();
    requestAnimationFrame(tick);
  }
  function setCaption(text) {
    shownCap = text;
    clearTimeout(capTimer);
    cap.classList.remove("on");
    if (text) capTimer = setTimeout(function () { cap.textContent = text; cap.classList.add("on"); }, cap.textContent ? 380 : 0);
  }
  var bd = document.getElementById("backdrop"), bctx = bd.getContext("2d"), rbg = document.getElementById("rbg"), rctx = rbg.getContext("2d"), bdN = 0;
  function drawBackdrops() {
    if (bdN++ % 6) return;
    var src = reacting || (phase === "loop" ? (loopv.readyState >= 2 ? loopv : stillEnd) : (mainv.readyState >= 2 ? mainv : stillStart));
    try { if (setName === "port") bctx.drawImage(src, 0, 0, 36, 64); if (reacting && setName === "land") rctx.drawImage(reacting, 0, 0, 36, 64); } catch (e) { /* not ready yet */ }
  }

  function say(spot, text) {
    var at = P(spot.at[0], spot.at[1]);
    var el = document.createElement("div");
    el.className = "bubble"; el.textContent = text;
    bubLayer.appendChild(el);
    var w = el.offsetWidth;
    el.style.left = Math.min(FW - w / 2 - 8, Math.max(w / 2 + 8, at[0])) + "px";
    el.style.top = Math.max(60, at[1]) + "px";
    setTimeout(function () { el.classList.add("out"); setTimeout(function () { el.remove(); }, 320); }, 2200);
  }
  function sfx(name) {
    if (!sound || !soundOn) return;
    if (name === "sparkle0") sound.sfx("sparkle", 0); else if (name === "sparkle1") sound.sfx("sparkle", 1); else sound.sfx(name, name === "jingle" ? 2 : 0);
  }
  var nudgeT = 0;
  function nudge(x, y) {
    if (reduced) return;
    cam.style.transformOrigin = x + "px " + y + "px";
    cam.style.transform = "scale(1.045)";
    clearTimeout(nudgeT);
    nudgeT = setTimeout(function () { cam.style.transform = ""; }, 260);
  }

  /* a tapped character cuts to their own little film, then back to the room */
  function playClip(name, x, y) {
    var v = name === "r1" ? r1v : r2v;
    if (failed(v)) return;
    reacting = v;
    var fl = document.getElementById("flash");
    fl.style.setProperty("--fxp", x + "px " + y + "px");
    fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    title.style.opacity = "0"; ring.hidden = true; hint.hidden = true; reopen.hidden = true;
    if (sound) sound.pause();
    v.muted = !soundOn;
    v.currentTime = 0;
    setTimeout(function () {
      var pr = v.play();
      v.classList.add("on");
      if (setName === "land") rbg.classList.add("on");
      if (pr && pr.catch) pr.catch(function () { v.muted = true; v.play().catch(endClip); });
    }, 180);
  }
  function endClip() {
    if (!reacting) return;
    var v = reacting;
    reacting = null;
    var fl = document.getElementById("flash");
    fl.style.setProperty("--fxp", "50% 50%");
    fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    setTimeout(function () { v.classList.remove("on"); rbg.classList.remove("on"); setTimeout(function () { v.pause(); }, 400); }, 150);
    title.style.opacity = "";
    if (!opened) { ring.hidden = false; hint.hidden = false; } else reopen.hidden = !cardwrap.hidden;
    if (sound && soundOn) sound.play();
  }
  [r1v, r2v].forEach(function (v) {
    v.addEventListener("ended", endClip);
    v.addEventListener("timeupdate", function () { if (reacting === v && v.duration && v.currentTime >= v.duration - 0.08) endClip(); });
  });

  taps.addEventListener("click", function (e) {
    var r = frame.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (reacting) { endClip(); return; }
    var pc = toPct(x, y), spot = spotAt(pc[0], pc[1]);
    if (spot && spot.id === "gift") { tapGift(); return; }
    nudge(x, y);
    if (!spot) { effect("sparkle", x, y); sfx("sparkle1"); return; }
    if (spot.id === "star") { var s = P(spot.at[0], spot.at[1]); effect("star", s[0], s[1] + 20); sfx("sparkle1"); return; }
    var L = LINES[spot.id];
    effect(L.fx, x, y, spot);
    if (L.say) say(spot, L.say());
    sfx(L.sfx);
    if (L.clip) setTimeout(function () { playClip(L.clip, x, y); }, 650);
  });

  function placeRing() {
    if (!SET) return;
    var g = P(SET.gift[0], SET.gift[1]);
    ring.style.left = g[0] + "px"; ring.style.top = g[1] + "px";
  }
  function tapGift() {
    var g = P(SET.gift[0], SET.gift[1]);
    effect("sparkle", g[0], g[1]);
    burst(g[0], g[1], 50, "conf", { colors: CONF, size: 5, speed: 240, lift: 260, g: 420, life: 1.8 });
    if (sound && soundOn) sound.chime();
    ring.hidden = true; hint.hidden = true; title.classList.remove("on");
    setTimeout(function () { showCard(g); }, opened ? 150 : 700);
    opened = true;
  }
  function showCard(g) {
    cardpop.style.setProperty("--fx", (g[0] - FW / 2).toFixed(0) + "px");
    cardpop.style.setProperty("--fy", (g[1] - FH / 2).toFixed(0) + "px");
    cardpop.style.animation = "none"; void cardpop.offsetWidth; cardpop.style.animation = "";
    cardwrap.hidden = false; reopen.hidden = true; tip.hidden = true;
    setTimeout(function () { document.getElementById("explore").focus({ preventScroll: true }); }, 60);
  }
  function closeCard() {
    cardwrap.hidden = true; reopen.hidden = false; title.classList.add("on");
    if (!tipShown) {
      tipShown = true;
      tip.innerHTML = "Tap anything: <b>Santa</b> and <b>the elves</b> have a surprise, or try <b>the cat</b>, <b>the tree</b>, <b>the star</b>, <b>the wreaths</b>" + (setName === "land" ? ", <b>the window</b>, <b>the fire</b>" : "") + " or <b>the stockings</b>.";
      tip.hidden = false;
      setTimeout(function () { tip.hidden = true; }, 7000);
    }
  }
  document.getElementById("explore").addEventListener("click", closeCard);
  cardwrap.addEventListener("click", function (e) { if (e.target === cardwrap) closeCard(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !cardwrap.hidden) closeCard(); });
  reopen.addEventListener("click", function () { showCard(P(SET.gift[0], SET.gift[1])); });

  /* ── the story, then the loop ── */
  function begin() {
    intro.classList.add("gone");
    skip.hidden = false; sndBtn.hidden = false;
    phase = "story";
    var fail = function () { vnote.hidden = false; setTimeout(function () { vnote.hidden = true; }, 6000); toLoop(); };
    if (failed(mainv)) { fail(); return; }
    mainv.muted = !soundOn;
    mainv.currentTime = 0;
    var pr = mainv.play();
    if (pr && pr.catch) pr.catch(function () { mainv.muted = true; mainv.play().catch(fail); });
    /* unlock the other films on this first tap, so phones let them play later */
    [loopv, r1v, r2v].forEach(function (v) { v.preload = "auto"; var m = v.muted; v.muted = true; var p2 = v.play(); if (p2 && p2.then) p2.then(function () { v.pause(); v.currentTime = 0; v.muted = m; }).catch(function () { v.muted = m; }); });
    setTimeout(function () { if (phase === "story" && mainv.currentTime < 0.2 && mainv.readyState < 3) fail(); }, 6000);
  }
  function toLoop() {
    if (phase === "loop") return;
    phase = "loop";
    setCaption(null);
    skip.hidden = true;
    stillStart.hidden = true; stillEnd.hidden = false;
    mainv.style.opacity = "0"; mainv.pause();
    loopv.currentTime = 0;
    var pr = loopv.play(); if (pr && pr.catch) pr.catch(function () {});
    document.getElementById("scrimB").style.opacity = "0.55";
    document.getElementById("scrimT").style.opacity = "1";
    title.classList.add("on");
    taps.hidden = false;
    if (!opened) { ring.hidden = false; hint.hidden = false; placeRing(); } else reopen.hidden = false;
    if (sound && soundOn) sound.play();
  }
  document.getElementById("begin").addEventListener("click", begin);
  skip.addEventListener("click", toLoop);
  document.getElementById("again").addEventListener("click", function () {
    cardwrap.hidden = true; reopen.hidden = true; ring.hidden = true; hint.hidden = true; taps.hidden = true; tip.hidden = true;
    title.classList.remove("on"); document.getElementById("scrimT").style.opacity = "0"; document.getElementById("scrimB").style.opacity = "1";
    loopv.pause(); loopv.style.opacity = "0"; stillEnd.hidden = true; mainv.style.opacity = "";
    if (sound) sound.pause();

    begin();
  });
  sndBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    sndBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    mainv.muted = !soundOn; r1v.muted = !soundOn; r2v.muted = !soundOn;
    if (sound) { if (soundOn && phase === "loop" && !reacting) sound.play(); else sound.pause(); }
  });

  layout();
  requestAnimationFrame(tick);
  window.cardDebug = { get phase() { return phase; }, get set() { return setName; }, get reacting() { return reacting ? reacting.id : null; }, main: mainv, loop: loopv, P: function (a, b) { return P(a, b); } };
})();
